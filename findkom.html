<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>FILKOM FIND</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0e17;
        --g: #0d1220;
        --p: #10151f;
        --p2: #151b28;
        --ln: #232c3d;
        --tx: #e8ecf4;
        --dm: #97a2b8;
        --ft: #5c6780;
        --tl: #5eead4;
        --on: #08201c;
        --am: #f0a860;
        --vi: #98a4ff;
        --sk: #67c9f2;
        --gr: #7fd694;
        --rd: #f2637a;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f4f6fb;
          --g: #e6ebf5;
          --p: #fff;
          --p2: #f0f3f9;
          --ln: #d5dbe8;
          --tx: #141a2a;
          --dm: #4f5a73;
          --ft: #7a859c;
          --tl: #0f766e;
          --on: #fff;
          --am: #b45309;
          --vi: #4f46e5;
          --sk: #0369a1;
          --gr: #15803d;
          --rd: #be123c;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background:
          var(--bg) linear-gradient(var(--g) 1px, transparent 1px),
          linear-gradient(90deg, var(--g) 1px, transparent 1px);
        background-size: 42px 42px;
        color: var(--tx);
        font:
          14.5px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
      }
      h1,
      h2,
      h3,
      h4,
      .br {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .mut {
        color: var(--dm);
      }
      .ft {
        color: var(--ft);
      }
      .mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--ft);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--ln);
        background: var(--p2);
        border-radius: 8px;
        padding: 9px 16px;
        font-weight: 600;
        transition: 0.15s;
      }
      .btn:hover {
        border-color: var(--tl);
      }
      .btn.pr {
        background: var(--tl);
        border-color: var(--tl);
        color: var(--on);
      }
      .btn.sm {
        padding: 6px 12px;
        font-size: 13px;
      }
      .btn.gh {
        background: none;
        border-color: transparent;
        color: var(--dm);
      }
      .btn.rd {
        color: var(--rd);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .w {
        width: 100%;
      }
      .ic {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .card {
        background: var(--p);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 18px;
      }
      .fl {
        margin-bottom: 14px;
      }
      .fl label {
        display: block;
        font-size: 12.5px;
        color: var(--dm);
        margin-bottom: 6px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: var(--p2);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 10px 12px;
        outline: 0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--tl);
      }
      select:disabled {
        opacity: 0.5;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .g4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }
      .st {
        background: var(--p);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .st b {
        font:
          700 26px "Space Grotesk",
          sans-serif;
        display: block;
      }
      .st.ac {
        border-color: var(--tl);
      }
      .st.ac b {
        color: var(--tl);
      }
      .bd {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 11.5px;
        font-weight: 600;
        background: color-mix(in srgb, currentColor 13%, transparent);
        white-space: nowrap;
      }
      .bd:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .ty {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
        color: var(--on);
        background: var(--rd);
      }
      .ty.found {
        background: var(--gr);
      }
      .ri {
        border: 1px solid var(--ln);
        border-left: 3px solid var(--ln);
        border-radius: 9px;
        background: var(--p);
        padding: 14px 16px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .sp {
        justify-content: space-between;
      }
      .tl {
        display: flex;
        margin-top: 10px;
        overflow-x: auto;
      }
      .tl i {
        flex: 1;
        min-width: 70px;
        text-align: center;
        position: relative;
        padding-top: 14px;
        font-style: normal;
        font-size: 10px;
        color: var(--ft);
      }
      .tl i:before {
        content: "";
        position: absolute;
        top: 5px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--ln);
      }
      .tl i:after {
        content: "";
        position: absolute;
        top: 1px;
        left: calc(50% - 5px);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--p2);
        border: 2px solid var(--ln);
      }
      .tl i.d {
        color: var(--dm);
      }
      .tl i.d:before {
        background: var(--tl);
      }
      .tl i.d:after {
        background: var(--tl);
        border-color: var(--tl);
      }
      .tl i.c {
        color: var(--dm);
      }
      .tl i.c:after {
        background: var(--sk);
        border-color: var(--sk);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--sk) 20%, transparent);
      }
      .hero {
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 18px;
        background:
          radial-gradient(
            circle at 90% 0,
            color-mix(in srgb, var(--tl) 16%, transparent),
            transparent 55%
          ),
          var(--p);
      }
      .hero h2 {
        font-size: 24px;
        margin-bottom: 4px;
      }
      .nt {
        border: 1px solid var(--tl);
        background: color-mix(in srgb, var(--tl) 8%, transparent);
        border-radius: 10px;
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }
      .nt .ic {
        color: var(--tl);
        margin-top: 3px;
      }
      .sg {
        display: inline-flex;
        background: var(--p);
        border: 1px solid var(--ln);
        border-radius: 99px;
        padding: 4px;
        margin-bottom: 16px;
      }
      .sg button {
        border: 0;
        background: none;
        padding: 8px 18px;
        border-radius: 99px;
        font-weight: 600;
        color: var(--dm);
      }
      .sg button.on {
        background: var(--tl);
        color: var(--on);
      }
      .tw {
        border: 1px solid var(--ln);
        border-radius: 10px;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        background: var(--p2);
        color: var(--ft);
        font-size: 11.5px;
        text-transform: uppercase;
        padding: 10px 14px;
      }
      td {
        padding: 11px 14px;
        border-top: 1px solid var(--ln);
      }
      .em {
        border: 1px dashed var(--ln);
        border-radius: 10px;
        padding: 34px 20px;
        text-align: center;
        color: var(--ft);
      }
      .vs {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 14px;
        align-items: center;
      }
      .vs > div {
        border: 1px solid var(--ln);
        border-radius: 9px;
        padding: 14px;
        background: var(--p2);
      }
      .vs h4 {
        font-size: 12px;
        color: var(--ft);
        margin-bottom: 6px;
      }
      .mr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border: 1px solid var(--ln);
        border-radius: 8px;
        margin-bottom: 8px;
        background: var(--p);
      }
      .bar {
        height: 6px;
        background: var(--p2);
        border-radius: 4px;
        overflow: hidden;
        margin: 4px 0 11px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--tl);
      }
      .ub {
        border: 1.5px dashed var(--ln);
        border-radius: 9px;
        padding: 16px;
        text-align: center;
        background: var(--p2);
        position: relative;
        font-size: 12px;
        color: var(--dm);
      }
      .ub.f {
        border-style: solid;
        border-color: var(--tl);
      }
      .ub img {
        max-width: 100%;
        max-height: 110px;
        border-radius: 6px;
        display: block;
        margin: 0 auto 8px;
      }
      .ub input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        padding: 0;
      }
      #md {
        position: fixed;
        inset: 0;
        background: rgba(6, 9, 15, 0.7);
        backdrop-filter: blur(2px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 200;
      }
      #md .card {
        max-width: 560px;
        width: 100%;
        max-height: 88vh;
        overflow: auto;
      }
      #ts {
        position: fixed;
        top: 18px;
        right: 18px;
        background: var(--p2);
        border: 1px solid var(--ln);
        border-left: 3px solid var(--tl);
        padding: 12px 16px;
        border-radius: 8px;
        max-width: 320px;
        display: none;
        z-index: 300;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      #gate {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 50px;
        align-items: center;
        max-width: 980px;
        margin: auto;
        padding: 32px 20px;
      }
      #gate h1 {
        font-size: 38px;
        line-height: 1.12;
        margin: 20px 0 12px;
      }
      #gate h1 b {
        color: var(--tl);
      }
      .sq {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--tl);
        position: relative;
        flex: none;
      }
      .sq:after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 2px solid var(--on);
        border-radius: 3px;
      }
      .rd {
        width: 230px;
        height: 230px;
        margin: auto;
        display: block;
      }
      .sw {
        transform-origin: 115px 115px;
        animation: sp 4.2s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .bl {
        animation: bk 2.6s ease-in-out infinite;
      }
      @keyframes bk {
        50% {
          opacity: 0.2;
        }
      }
      #app {
        display: none;
        min-height: 100vh;
      }
      #app.on {
        display: flex;
      }
      #sb {
        width: 240px;
        flex: none;
        background: var(--p);
        border-right: 1px solid var(--ln);
        display: flex;
        flex-direction: column;
        padding: 20px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        gap: 2px;
      }
      .nv {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--dm);
        font-weight: 500;
        text-align: left;
        width: 100%;
      }
      .nv:hover {
        background: var(--p2);
        color: var(--tx);
      }
      .nv.on {
        background: color-mix(in srgb, var(--tl) 10%, transparent);
        color: var(--tl);
      }
      main {
        flex: 1;
        min-width: 0;
        padding: 28px 34px 60px;
        max-width: 1180px;
      }
      .hb {
        display: none;
      }
      @media (max-width: 900px) {
        #gate {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .rd {
          width: 150px;
          height: 150px;
          order: -1;
        }
        #sb {
          position: fixed;
          left: 0;
          top: 0;
          transform: translateX(-100%);
          transition: 0.2s;
          z-index: 150;
        }
        #sb.open {
          transform: none;
        }
        .hb {
          display: inline-flex;
        }
        main {
          padding: 20px 16px 50px;
        }
        .g4 {
          grid-template-columns: 1fr 1fr;
        }
        .g2,
        .vs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="ts"></div>
    <div id="md"></div>
    <div id="gate">
      <div>
        <div class="row br" style="font-size: 16px">
          <div class="sq"></div>
          FILKOM FIND
        </div>
        <h1>Barang hilang di FILKOM,<br /><b>ketemu lebih cepat.</b></h1>
        <p class="mut" style="max-width: 440px; margin-bottom: 22px">
          Laporkan kehilangan atau temuan di satu tempat. Sistem mencocokkan otomatis dari gedung,
          kategori, dan waktu; Security tinggal memverifikasi.
        </p>
        <div id="lf"></div>
      </div>
      <svg class="rd" viewBox="0 0 230 230" fill="none" stroke="var(--ln)">
        <circle cx="115" cy="115" r="108" />
        <circle cx="115" cy="115" r="78" />
        <circle cx="115" cy="115" r="46" />
        <path d="M115 7v216M7 115h216" />
        <g class="sw">
          <path
            d="M115 115V7A108 108 0 0 1 191 46Z"
            fill="var(--tl)"
            fill-opacity=".22"
            stroke="none"
          />
        </g>
        <circle class="bl" cx="150" cy="80" r="4" fill="var(--tl)" stroke="none" />
        <circle
          class="bl"
          style="animation-delay: 0.8s"
          cx="80"
          cy="140"
          r="4"
          fill="var(--am)"
          stroke="none"
        />
        <circle
          class="bl"
          style="animation-delay: 1.6s"
          cx="150"
          cy="150"
          r="4"
          fill="var(--vi)"
          stroke="none"
        />
      </svg>
    </div>
    <div id="app">
      <aside id="sb">
        <div
          class="row br"
          style="padding: 0 6px 18px; border-bottom: 1px solid var(--ln); margin-bottom: 14px"
        >
          <div class="sq"></div>
          FILKOM FIND
        </div>
        <nav id="nav" style="flex: 1"></nav>
        <div id="me" style="border-top: 1px solid var(--ln); padding-top: 12px"></div>
        <button class="nv" data-a="out">↩ Keluar</button>
      </aside>
      <main>
        <div class="row" style="gap: 12px; margin-bottom: 22px">
          <button class="btn sm hb" data-a="mn">☰</button>
          <div>
            <h2 id="vt" style="font-size: 21px"></h2>
            <div id="vs" class="mut"></div>
          </div>
        </div>
        <div id="vb"></div>
      </main>
    </div>
    <script>
      // ===== DATA DAN FUNGSI BANTU =====
      const $ = (s) => document.querySelector(s),
        K = "filkomfind:v3",
        esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          ),
        pad = (n) => String(n).padStart(4, "0"),
        now = () => new Date().toISOString(),
        uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
        TD = now().slice(0, 10);
      const fd = (d) =>
          new Date(d + "T00:00").toLocaleDateString("id-ID", {
            day: "numeric",
            month: "short",
            year: "numeric",
          }),
        fdt = (i) =>
          new Date(i).toLocaleString("id-ID", {
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
          });
      // Data awal: daftar gedung dan kategori (Master Data)
      const seed = () => ({
        loc: [
          "Gedung A",
          "Gedung B",
          "Gedung C",
          "Gedung D",
          "Gedung E",
          "Gedung F",
          "Gedung G (Dekanat)",
          "Perpustakaan FILKOM",
        ],
        cat: [
          "Dompet",
          "Handphone",
          "Kunci",
          "Tas / Ransel",
          "Laptop / Tablet",
          "Kartu (KTM/ATM)",
          "Aksesoris",
          "Alat Tulis",
          "Lainnya",
        ],
        rep: [],
        mt: [],
        n: { l: 0, f: 0, m: 0 },
      });
      // Database tiruan: disimpan di localStorage browser
      let db;
      try {
        db = JSON.parse(localStorage.getItem(K));
      } catch (e) {}
      db = db || seed();
      const save = () => {
        try {
          localStorage.setItem(K, JSON.stringify(db));
        } catch (e) {}
      };
      let S = {
        u: null,
        r: null,
        v: null,
        tab: "lost",
        lr: "civ",
        q: { ty: "", cat: "", b: "", kw: "" },
        ph: null,
        ho: null,
      };
      const P = {
        dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
        find: '<circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 20 20"/>',
        hand: '<path d="M8 12V6a2 2 0 1 1 4 0v5M12 11V4a2 2 0 1 1 4 0v7M16 11.5V6a2 2 0 1 1 4 0v9c0 4-3 7-7 7h-1a6 6 0 0 1-5-2.7L3.5 14a1.8 1.8 0 0 1 2.700-2.400L8 14"/>',
        tbl: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
        map: '<path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3ZM9 3v15M15 6v15"/>',
        ok: '<path d="M20 6 9 17l-5-5"/>',
        x: '<path d="M18 6 6 18M6 6l12 12"/>',
        cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.4"/>',
        bell: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.700 21a2 2 0 0 1-3.400 0"/>',
        arr: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      };
      const I = (k) =>
        `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${P[k]}</svg>`;
      const ST = {
          LOST_REPORTED: ["Menunggu Kandidat", "am"],
          FOUND_REPORTED: ["Menunggu Kandidat", "am"],
          MATCH_CANDIDATE: ["Kandidat Cocok", "vi"],
          VERIFIED_MATCH: ["Terverifikasi", "tl"],
          NOTIFIED: ["Menunggu Diambil", "sk"],
          RETURNED: ["Sudah Diserahkan", "gr"],
          CLOSED: ["Selesai", "ft"],
          REJECTED: ["Ditolak (Tidak Cocok)", "rd"],
        },
        OPEN = ["LOST_REPORTED", "FOUND_REPORTED"];
      const bd = (s) => `<span class="bd" style="color:var(--${ST[s][1]})">${ST[s][0]}</span>`,
        STP = ["LOST_REPORTED", "MATCH_CANDIDATE", "VERIFIED_MATCH", "NOTIFIED", "RETURNED"],
        SL = ["Dilaporkan", "Kandidat", "Terverifikasi", "Diberitahu", "Diambil"];
      const tline = (s) => {
        let i = STP.indexOf(s == "FOUND_REPORTED" ? "LOST_REPORTED" : s);
        if (s == "CLOSED") i = 4;
        if (s == "REJECTED") i = 0;
        return `<div class="tl">${SL.map((t, k) => `<i class="${k < i ? "d" : k == i ? "c" : ""}">${t}</i>`).join("")}</div>`;
      };
      const op = (a, ph) =>
        `<option value="">${ph}</option>` + a.map((x) => `<option>${esc(x)}</option>`).join("");
      const rooms = (b) => {
        const m = b.match(/^Gedung (\w)/);
        if (!m) return ["Lt 1", "Lt 2", "Lt 3", "Lobby / Koridor"];
        const a = [];

          const r = new FileReader();
          r.onload = (e) => {
            const i = new Image();
            i.onload = () => {
              let w = i.width,
                h = i.height,
                k = Math.min(1, mx / Math.max(w, h));
              w = Math.round(w * k);
              h = Math.round(h * k);
              const c = document.createElement("canvas");
              c.width = w;
              c.height = h;
              c.getContext("2d").drawImage(i, 0, 0, w, h);
              ok(c.toDataURL("image/jpeg", q));
            };
            i.src = e.target.result;
          };
          r.readAsDataURL(f);
        });

        }
      });
      // ===== EVENT: ganti pilihan / unggah foto =====
      document.addEventListener("change", async (e) => {
        const t = e.target;
        if (t.id == "bs") {
          $("#rs").disabled = !t.value;
          $("#rs").innerHTML = op(
            t.value ? rooms(t.value) : [],
            t.value ? "Pilih ruang" : "Pilih gedung dulu",
          );
        } else if (t.id == "ph" && t.files[0]) {
          S.ph = await img(t.files[0], 760, 0.62);
          $("#ub").className = "ub f";
          $("#ub").innerHTML =
            `<img src="${S.ph}">Foto terpasang, klik untuk ganti<input type="file" accept="image/*" id="ph">`;
        } else if (t.dataset.h && t.files[0]) {
          S.ho[t.dataset.h] = await img(t.files[0], 640, 0.6);
          mod();
        } else if (t.dataset.f) {
          S.q[t.dataset.f] = t.value;
          res();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.dataset.f == "kw") {
          S.q.kw = e.target.value;
          res();
        }
      });
      gate();
    </script>
  </body>
</html>
